<nz-card [nzTitle]="title()">
  @if (rows().length === 0) {
    <p class="m-0 text-sm opacity-70">{{ empty() }}</p>
  } @else {
    <dl class="m-0 grid grid-cols-[1fr_auto] gap-x-4 gap-y-2 text-sm">
      @for (row of rows(); track row.term) {
        <dt class="min-w-0 truncate opacity-70">{{ row.term }}</dt>
        <dd class="m-0 text-right font-medium">{{ row.value }}</dd>
      }
    </dl>
  }

  <ng-content select="[slot=actions]" />
</nz-card>
