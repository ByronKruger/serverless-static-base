@if (loading()) {
  <nz-skeleton [nzActive]="true" [nzParagraph]="{ rows: 4 }" />
} @else if (error(); as apiError) {
  <nz-alert
    class="block"
    nzType="error"
    [nzMessage]="apiError.title"
    [nzDescription]="apiError.detail ?? ''"
    nzShowIcon
  />
} @else {
  <app-page-header [heading]="heading()" [description]="subtitle()" />

  @if (hasPreferences()) {
    <!-- The same primitive the My-preferences page renders, so one saved preference
         looks the same whoever is looking at it. -->
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">
      @for (card of cards(); track card.id) {
        <app-detail-card
          [title]="card.title"
          [rows]="card.rows"
          empty="Nothing specified - just the drink itself."
        />
      }
    </div>
  } @else {
    <nz-empty nzNotFoundImage="simple" [nzNotFoundContent]="emptyContent" />

    <ng-template #emptyContent>
      <span>{{ heading() }} has not saved a preference yet.</span>
    </ng-template>
  }
}
