<app-page-header
  heading="My preferences"
  description="How you like each drink. One preference per beverage type."
>
  <a slot="actions" nz-button nzType="primary" routerLink="new">
    <nz-icon nzType="plus" />
    New preference
  </a>
</app-page-header>

@if (error(); as apiError) {
  <nz-alert
    class="mb-4 block"
    nzType="error"
    [nzMessage]="apiError.title"
    [nzDescription]="apiError.detail ?? ''"
    nzShowIcon
  />
}

@if (loading()) {
  <nz-skeleton [nzActive]="true" [nzParagraph]="{ rows: 4 }" />
} @else if (hasPreferences()) {
  <!-- Container queries, not viewport media: these cards are reusable, and the shell
       already owns the viewport breakpoints (Docs/ARCHITECTURE.md). -->
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">
    @for (card of cards(); track card.id) {
      <app-detail-card
        [title]="card.title"
        [rows]="card.rows"
        empty="Nothing specified - just the drink itself."
      />
    }
  </div>
} @else {
  <nz-empty
    nzNotFoundImage="simple"
    [nzNotFoundContent]="emptyContent"
    [nzNotFoundFooter]="emptyFooter"
  />

  <ng-template #emptyContent>
    <span>You have not saved a preference yet.</span>
  </ng-template>

  <ng-template #emptyFooter>
    <a nz-button nzType="primary" routerLink="new">
      <nz-icon nzType="plus" />
      Create your first one
    </a>
  </ng-template>
}
